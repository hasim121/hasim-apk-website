<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hasim Apk | Premium Apps</title>
  <meta name="theme-color" content="#080808">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
    header{padding:22px 16px;text-align:center;border-bottom:1px solid #b89035}
    header img{width:65px;height:65px;object-fit:contain}
    h1{color:#e9bf54;margin:10px 0 5px}
    header p{color:#bbb;margin:0}
    main{max-width:750px;margin:25px auto;padding:0 16px}
    input,button{width:100%;padding:13px;margin:8px 0;border-radius:9px;font-size:16px}
    input{background:#171717;color:white;border:1px solid #555}
    button{background:#d5aa42;color:#111;border:0;font-weight:bold}
    .card{border:1px solid #514321;border-radius:12px;padding:18px;margin-top:18px}
    .muted{color:#aaa}
    footer{text-align:center;color:#888;padding:25px}
  </style>
</head>
<body>
  <header>
    <img src="/logo.png" alt="Hasim Apk Logo" onerror="this.style.display='none'">
    <h1>👑 Hasim Apk</h1>
    <p>Premium Android Apps Download</p>
  </header>
  <main>
    <input id="search" placeholder="অ্যাপের নাম খুঁজুন..." oninput="loadApps()">
    <div id="apps" class="muted">অ্যাপ লোড হচ্ছে...</div>
  </main>
  <footer>© Hasim Apk — Download apps responsibly.</footer>
  <script>
    async function loadApps(){
      const box=document.getElementById('apps');
      try{
        const r=await fetch('/api/apps');
        if(!r.ok) throw new Error();
        const data=await r.json();
        const q=document.getElementById('search').value.toLowerCase();
        const apps=data.filter(a=>(a.name||'').toLowerCase().includes(q));
        box.innerHTML=apps.length?apps.map(a=>`
          <section class="card">
            <h2>${escapeHtml(a.name)}</h2>
            <p class="muted">${escapeHtml(a.description||'Android application')}</p>
            <p class="muted">Version: ${escapeHtml(a.version||'1.0')}</p>
            <a href="/api/download/${encodeURIComponent(a.id)}">
              <button>Download APK</button>
            </a>
          </section>`).join(''):'কোনো অ্যাপ পাওয়া যায়নি।';
      }catch(e){
        box.textContent='অ্যাপ লোড করা যায়নি। সার্ভার চালু হলে এখানে অ্যাপ দেখা যাবে।';
      }
    }
    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    loadApps();
  </script>
</body>
</html>
